[package]
# Semantic Versioning is used: https://semver.org/
version = "1.0.0"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["zhang zhuangzhuang"]

# The title and description fields are primarily for displaying extension info in UI
title = "Chat RAPID"
description="AI-powered assistant for natural-language-driven procedural generation of 3D forest scenes in NVIDIA Omniverse. Automatically configures terrain, vegetation, and OpenUSD scene generation from user-defined forest parameters."

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

# URL of the extension source repository.
repository = ""

# One of categories for UI.
category = "Example"

# Keywords for the extension
keywords = ["kit", "example", "RAPID-RTX", "rapid"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Preview image and icon. Folder named "data" automatically goes in git lfs (see .gitattributes file).
# Preview image is shown in "Overview" of Extensions window. Screenshot of an extension might be a good preview image.
preview_image = "data/preview.png"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icon.png"

# ============================================================
# Chat USD configuration
# ============================================================
[settings.exts."omni.ai.chat_usd.bundle"]
# Placeholder only.
# Used to satisfy the built-in NVIDIA model initialization.
# DeepSeek is the actual model used by Chat RAPID.
nvidia_api_key = "placeholder"

# ============================================================
# DeepSeek custom chat model
# ============================================================
[settings.exts."omni.ai.chat_usd.bundle".custom_chat_model]
nice_name = "DeepSeek"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-v4-flash"
api_key = "YOUR_DEEPSEEK_API_KEY"


# Use omni.ui to build simple UI
[dependencies]
"omni.kit.uiapp" = {}
"omni.ai.langchain.agent.omni_ui" = { optional = true }
"omni.ai.langchain.agent.usd_code" = { version = "2.0.3" }
"omni.ai.langchain.extra" = { optional = true }
"omni.ai.langchain.widget.core" = { version = "2.0.2" }
"omni.ai.chat_usd.bundle" = { version = "2.0.4" }

# Main python module this extension provides, it will be publicly available as "import rapid.helloworld".
[[python.module]]
name = "rapid.chat_rapid"

[[test]]
# Extra dependencies only to be used during test run
dependencies = [
    "omni.kit.ui_test" # UI testing extension
]
